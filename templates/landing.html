<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fintech — Next Generation Finance</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }

    /* ─────────────────────────────────────
       INTRO VIDEO OVERLAY
    ───────────────────────────────────── */
    #intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      transition: opacity 0.8s ease;
    }

    #intro-video {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Skip button */
    #skip-btn {
      position: absolute;
      bottom: 32px; right: 32px;
      z-index: 10000;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(100, 180, 255, 0.3);
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.25s ease;
      backdrop-filter: blur(4px);
      font-family: 'Inter', sans-serif;
    }
    #skip-btn:hover {
      color: #fff;
      border-color: rgba(100, 180, 255, 0.8);
      background: rgba(30, 80, 180, 0.3);
    }

    /* Progress bar */
    #progress-bar {
      position: absolute;
      bottom: 0; left: 0;
      height: 2px;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa, #93c5fd);
      box-shadow: 0 0 10px rgba(96, 165, 250, 0.8);
      transition: width 0.1s linear;
    }

    /* Fade-out class */
    #intro-overlay.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* ─────────────────────────────────────
       MAIN WEBSITE CONTENT
    ───────────────────────────────────── */
    #main-content {
      width: 100%; height: 100%;
      opacity: 0;
      transition: opacity 1s ease 0.3s;
      overflow: auto;

      /* ── Background matching the aesthetic ── */
      background: #050709;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 24px;
      color: #fff;
      position: relative;
    }

    #main-content.visible {
      opacity: 1;
      overflow: auto;
    }

    .demo-badge {
      font-size: 11px;
      letter-spacing: 0.5em;
      color: rgba(96, 165, 250, 0.6);
      text-transform: uppercase;
      font-weight: 300;
      z-index: 10;
    }
    .demo-title {
      font-size: clamp(40px, 7vw, 96px);
      font-weight: 900;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 0%, #93c5fd 50%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
      line-height: 1;
      z-index: 10;
    }
    .demo-sub {
      font-size: clamp(14px, 1.5vw, 18px);
      color: rgba(148, 197, 253, 0.5);
      letter-spacing: 0.2em;
      font-weight: 300;
      z-index: 10;
    }
    .demo-btn {
      margin-top: 16px;
      padding: 14px 40px;
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      box-shadow: 0 0 40px rgba(59, 130, 246, 0.4);
      transition: all 0.3s ease;
      z-index: 10;
      text-decoration: none;
      display: inline-block;
    }
    .demo-btn:hover {
      box-shadow: 0 0 60px rgba(59, 130, 246, 0.7);
      transform: translateY(-2px);
    }

    /* Ambient background glow */
    .bg-glow {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
    }
    .bg-glow::before {
      content: '';
      position: absolute;
      top: -20%; left: 50%; transform: translateX(-50%);
      width: 80vw; height: 60vh;
      background: radial-gradient(ellipse, rgba(30, 80, 200, 0.2) 0%, transparent 70%);
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <!-- ══════════════════════════════════
       INTRO VIDEO OVERLAY
  ══════════════════════════════════ -->
  <div id="intro-overlay">
    <video
      id="intro-video"
      autoplay
      muted
      playsinline
      preload="auto"
    >
      <source src="{{ url_for('static', filename='intro.mp4') }}" type="video/mp4">
    </video>
    <div id="progress-bar"></div>
    <button id="skip-btn" onclick="endIntro()">Skip ›</button>
  </div>

  <!-- ══════════════════════════════════
       STARTING PAGE CONTENT
  ══════════════════════════════════ -->
  <div id="main-content">
    <div class="bg-glow"></div>
    <p class="demo-badge">Welcome to</p>
    <h1 class="demo-title">FINTECH</h1>
    <p class="demo-sub">Next Generation Finance</p>
    <a href="/login" style="text-decoration: none;"><button class="demo-btn">Get Started</button></a>
  </div>

  <script>
    const overlay   = document.getElementById('intro-overlay');
    const video     = document.getElementById('intro-video');
    const progress  = document.getElementById('progress-bar');
    const main      = document.getElementById('main-content');

    // ── Update progress bar ──
    video.addEventListener('timeupdate', () => {
      if (video.duration) {
        const pct = (video.currentTime / video.duration) * 100;
        progress.style.width = pct + '%';
      }
    });

    // ── Auto-end when video finishes ──
    video.addEventListener('ended', () => {
      endIntro();
    });

    // ── Fallback: if video fails to load, skip after 1s ──
    video.addEventListener('error', () => {
      setTimeout(endIntro, 1000);
    });

    // ── If video can't play at all, still show site ──
    setTimeout(() => {
      if (video.paused && video.currentTime === 0) {
        endIntro();
      }
    }, 500);

    // ── End intro & reveal site ──
    function endIntro() {
      overlay.classList.add('fade-out');
      main.classList.add('visible');
      // Remove overlay from DOM after fade
      setTimeout(() => {
        if (overlay.parentNode) {
            overlay.parentNode.removeChild(overlay);
        }
        document.body.style.overflow = 'auto';
      }, 1000);
    }
  </script>
</body>
</html>
